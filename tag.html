<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etiqueta — The Soft Machine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="site-header"></div>

<div class="page-wrap">
  <div class="main-layout">
    <main class="content-area">

      <div class="section-header">
        Etiqueta: <span id="tag-name">—</span> <span>Más recientes primero</span>
      </div>

      <table class="article-table">
        <thead>
          <tr>
            <th style="width:55%">Título</th>
            <th style="width:12%">Tipo</th>
            <th style="width:13%">Fecha</th>
            <th style="width:10%">Lecturas</th>
          </tr>
        </thead>
        <tbody id="listing-body">
          <tr><td colspan="4" style="text-align:center; color:#888; padding:24px 0;">Cargando…</td></tr>
        </tbody>
      </table>

    </main>

    <aside class="sidebar" id="site-sidebar"></aside>
  </div>
</div>

<div id="site-footer"></div>

<script src="components.js"></script>
<script src="listings.js"></script>
<script>
  const tsmTag = new URLSearchParams(location.search).get('t') || '';
  document.getElementById('tag-name').textContent = tsmTag || '(sin especificar)';
  initSite({ page: '', breadcrumb: 'Etiqueta &rsaquo; <strong>' + tsmTag.replace(/</g,'&lt;') + '</strong>' });
  renderListing('listing-body', a => (a.tags || []).includes(tsmTag), 'Todavía no hay escritos con esta etiqueta.');
</script>
</body>
</html>
