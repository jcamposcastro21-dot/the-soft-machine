<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Soft Machine</title>
  <link rel="stylesheet" href="style.css">
  <link rel="alternate" type="application/rss+xml" title="The Soft Machine — RSS" href="feed.xml">
  <link rel="alternate" type="application/atom+xml" title="The Soft Machine — Atom" href="atom.xml">
  <link rel="alternate" type="application/json" title="The Soft Machine — JSON Feed" href="feed.json">
</head>
<body>

<div id="site-header"></div>

<div class="page-wrap">
  <div class="main-layout">
    <main class="content-area">

      <!-- Esta tabla se llena en tiempo real desde data/articulos.json
           (ver listings.js). No edites filas a mano aquí: publica o
           edita escritos desde /admin.html. -->
      <div class="section-header">
        Entradas recientes <span>Ordenado por fecha — más reciente primero</span>
      </div>
      <table class="article-table">
        <thead>
          <tr>
            <th style="width:55%">Título / Extracto</th>
            <th style="width:12%">Tipo</th>
            <th style="width:13%">Fecha</th>
            <th style="width:10%">Lecturas</th>
          </tr>
        </thead>
        <tbody id="listing-body">
          <tr><td colspan="4" style="text-align:center; color:#888; padding:24px 0;">Cargando…</td></tr>
        </tbody>
      </table>

    </main>

    <aside class="sidebar" id="site-sidebar"></aside>
  </div>
</div>

<div id="site-footer"></div>

<script src="components.js"></script>
<script src="listings.js"></script>
<script>
  initSite({ page: 'inicio' });
  renderListing('listing-body', () => true, 'Todavía no hay escritos publicados.', 8);
</script>
</body>
</html>
